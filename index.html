    let currentImageIndex = 0;
    const imageSlides = document.querySelectorAll('#image-slider img');
    const totalImages = imageSlides.length;
    let autoSlideInterval;

    function updateImageSlider() {
      imageSlides.forEach((img, index) => {
        if (index === currentImageIndex) {
          img.classList.add('active');
        } else {
          img.classList.remove('active');
        }
      });
    }

    function moveImageSlide(step) {
      currentImageIndex = currentImageIndex + step;
      if (currentImageIndex < 0) {
        currentImageIndex = totalImages - 1;
      } else if (currentImageIndex >= totalImages) {
        currentImageIndex = 0;
      }
      updateImageSlider();
      resetAutoSlide();
    }

    function resetAutoSlide() {
      clearInterval(autoSlideInterval);
      autoSlideInterval = setInterval(() => {
        moveImageSlide(1);
      }, 8000);
    }

    // Auto-Slide alle 8 Sekunden
    resetAutoSlide();

    // Pause Auto-Slide beim Hover über den Slider
    const imageSlider = document.getElementById('image-slider');
    imageSlider.addEventListener('mouseenter', () => {
      clearInterval(autoSlideInterval);
    });
    imageSlider.addEventListener('mouseleave', () => {
      resetAutoSlide();
    });

      const total = slides.children.length;
      const sliderContainer = document.querySelector('.slider-container');
      
      // Linker Button: Verstecken auf US Army (index 0)

        slideBtnLeft.classList.add('hidden');
      } else {
        slideBtnLeft.classList.remove('hidden');
      }
      
      // Rechter Button: Verstecken auf USAF (index 1, letzte Slide)

        slideBtnRight.classList.add('hidden');
      } else {
        slideBtnRight.classList.remove('hidden');
      }
      
      // Rahmen blau machen auf Air Force Seite (index 1)
      const zeusSection = document.querySelector('.zeus-section');

        sliderContainer.classList.add('airforce');
        if (zeusSection) {
          zeusSection.style.borderColor = '#2596be';
          zeusSection.style.borderTopColor = 'rgba(37, 150, 190, 0.3)';
        }
      } else {
        sliderContainer.classList.remove('airforce');
        if (zeusSection) {
          zeusSection.style.borderColor = '#007800';
          zeusSection.style.borderTopColor = 'rgba(0, 120, 0, 0.4)';
        }
      }
    }
    
    function moveSlide(step){
      const slides = document.getElementById('slides');
      const total = slides.children.length;
      index = index + step;
      if(index < 0) index = total - 1;
      if(index >= total) index = 0;
      slides.style.transform = 'translateX(' + (-index * 100) + '%)';
      updateSlideButtons();
    }

    // Globale Variablen für Pagination und Suche
    let allOperations = [];
    let currentPage = 1;
    const itemsPerPage = 5;
    let searchQuery = '';

    function renderOperations(data) {
      if (!data || !data.operations) return;
      
      // Speichere alle Operationen global
      allOperations = [...data.operations];
      
      // Sortiere nach ID (höchste zuerst)
      allOperations.sort((a, b) => b.id - a.id);
      
      // Initialisiere Suche und Pagination
      setupSearchAndPagination();
      filterAndRenderOperations();
    }

    function setupSearchAndPagination() {
      const searchInput = document.getElementById('operations-search');
      if (searchInput) {
        searchInput.addEventListener('input', (e) => {
          searchQuery = e.target.value.toLowerCase().trim();
          currentPage = 1; // Zurück zur ersten Seite bei neuer Suche
          filterAndRenderOperations();
        });
      }
    }

    function filterAndRenderOperations() {
      // Filtere Operationen basierend auf Suchanfrage
      let filteredOperations = allOperations;
      if (searchQuery) {
        filteredOperations = allOperations.filter(op => {
          const searchText = searchQuery;
          return (
            op.title.toLowerCase().includes(searchText) ||
            op.description.toLowerCase().includes(searchText) ||
            op.type.toLowerCase().includes(searchText) ||
            op.status.toLowerCase().includes(searchText) ||
            (op.detailedDescription && op.detailedDescription.toLowerCase().includes(searchText))
          );
        });
      }

      // Berechne Pagination
      const totalPages = Math.ceil(filteredOperations.length / itemsPerPage);
      const startIndex = (currentPage - 1) * itemsPerPage;
      const endIndex = startIndex + itemsPerPage;
      const operationsToShow = filteredOperations.slice(startIndex, endIndex);

      // Rendere Operationen
      const container = document.getElementById('operations-container');
      if (container) {
        if (operationsToShow.length === 0) {
          container.innerHTML = '<div class="no-results">Keine Einsätze gefunden.</div>';
        } else {
          container.innerHTML = operationsToShow.map(op => `
            <div class="operation-card" data-operation-id="${op.id}">
              <div class="operation-header">
                <h3 class="operation-title">${op.title}</h3>
                <div class="operation-meta">
                  <span class="operation-type">${op.type}</span>
                  <span class="operation-date">${new Date(op.date).toLocaleDateString('de-DE')}</span>
                </div>
              </div>
              <div class="operation-description">${op.description}</div>
              <div class="operation-stats">
                <span>Teilnehmer: ${op.participants}</span>
                <span class="operation-status ${op.status === 'Geplant' ? 'status-planned' : ''}">${op.status}</span>
              </div>
              <div class="operation-details">
                <div class="operation-details-content">
                  <div class="operation-details-header">
                    <h3 class="operation-details-title">${op.title}</h3>
                    <div class="operation-details-meta">
                      <span>Datum: ${new Date(op.date).toLocaleDateString('de-DE')}</span>
                      ${op.time ? `<span>Zeit: ${op.time} Uhr</span>` : ''}
                    </div>
                  </div>
                  ${op.detailedDescription ? `<div class="operation-details-text">${op.detailedDescription}</div>` : ''}
                  ${(op.images && op.images.length > 0) ? `
                    <div class="operation-image-slider" data-operation-id="${op.id}">
                      ${op.images.map((img, idx) => `
                        <img src="${img}" alt="${op.title} - Bild ${idx + 1}" class="operation-details-image ${idx === 0 ? 'active' : ''}">
                      `).join('')}
                      ${op.images.length > 1 ? `
                        <button class="operation-slider-btn operation-slider-btn-left" onclick="moveOperationImage(${op.id}, -1)" aria-label="Vorheriges Bild">❮</button>
                        <button class="operation-slider-btn operation-slider-btn-right" onclick="moveOperationImage(${op.id}, 1)" aria-label="Nächstes Bild">❯</button>
                      ` : ''}
                    </div>
                  ` : (op.image ? `<img src="${op.image}" alt="${op.title}" class="operation-details-image">` : '')}
                </div>
              </div>
            </div>
          `).join('');
        }
      }

      // Rendere Pagination
      renderPagination(totalPages, filteredOperations.length);

      // Click-Handler für Aufklappen hinzufügen
      document.querySelectorAll('.operation-card').forEach(card => {
        card.addEventListener('click', function(e) {
          // Verhindere Aufklappen wenn auf Slider-Button geklickt wird
          if (e.target.classList.contains('operation-slider-btn')) {
            return;
          }
          this.classList.toggle('active');
          
          // Starte automatisches Wechseln wenn geöffnet
          if (this.classList.contains('active')) {
            const operationId = this.dataset.operationId;
            startOperationImageAutoSlide(operationId);
          } else {
            // Stoppe automatisches Wechseln wenn geschlossen
            const operationId = this.dataset.operationId;
            stopOperationImageAutoSlide(operationId);
          }
        });
      });
      
      // Initialisiere automatisches Wechseln für alle geöffneten Slider
      document.querySelectorAll('.operation-card.active').forEach(card => {
        const operationId = card.dataset.operationId;
        startOperationImageAutoSlide(operationId);
      });
    }

    function renderPagination(totalPages, totalItems) {
      const paginationContainer = document.getElementById('operations-pagination');
      if (!paginationContainer) return;

      if (totalPages <= 1) {
        paginationContainer.innerHTML = '';
        return;
      }

      let paginationHTML = '<div class="pagination-info">';
      const startIndex = (currentPage - 1) * itemsPerPage + 1;
      const endIndex = Math.min(currentPage * itemsPerPage, totalItems);
      paginationHTML += `Zeige ${startIndex}-${endIndex} von ${totalItems} Einsätzen</div>`;
      paginationHTML += '<div class="pagination-buttons">';

      // Vorherige Seite Button
      if (currentPage > 1) {
        paginationHTML += `<button class="pagination-btn" onclick="changePage(${currentPage - 1})">❮ Zurück</button>`;
      } else {
        paginationHTML += `<button class="pagination-btn disabled" disabled>❮ Zurück</button>`;
      }

      // Seitenzahlen
      for (let i = 1; i <= totalPages; i++) {
        if (i === 1 || i === totalPages || (i >= currentPage - 1 && i <= currentPage + 1)) {
          if (i === currentPage) {
            paginationHTML += `<button class="pagination-btn active">${i}</button>`;
          } else {
            paginationHTML += `<button class="pagination-btn" onclick="changePage(${i})">${i}</button>`;
          }
        } else if (i === currentPage - 2 || i === currentPage + 2) {
          paginationHTML += `<span class="pagination-ellipsis">...</span>`;
        }
      }

      // Nächste Seite Button
      if (currentPage < totalPages) {
        paginationHTML += `<button class="pagination-btn" onclick="changePage(${currentPage + 1})">Weiter ❯</button>`;
      } else {
        paginationHTML += `<button class="pagination-btn disabled" disabled>Weiter ❯</button>`;
      }

      paginationHTML += '</div>';
      paginationContainer.innerHTML = paginationHTML;
    }

    window.changePage = function(page) {
      currentPage = page;
      filterAndRenderOperations();
      // Scroll nach oben zum Container
      const container = document.getElementById('operations-section');
      if (container) {
        container.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
    };
    
    // Automatisches Wechseln der Bilder (alle 10 Sekunden)
    const operationImageIntervals = {};
    
    function startOperationImageAutoSlide(operationId) {
      // Stoppe vorheriges Intervall falls vorhanden
      if (operationImageIntervals[operationId]) {
        clearInterval(operationImageIntervals[operationId]);
      }
      
      const slider = document.querySelector(`.operation-image-slider[data-operation-id="${operationId}"]`);
      if (!slider) return;
      
      const images = slider.querySelectorAll('.operation-details-image');
      if (images.length <= 1) return;
      
      // Wechsle alle 10 Sekunden
      operationImageIntervals[operationId] = setInterval(() => {
        moveOperationImage(operationId, 1);
      }, 10000);
    }
    
    function stopOperationImageAutoSlide(operationId) {
      if (operationImageIntervals[operationId]) {
        clearInterval(operationImageIntervals[operationId]);
        delete operationImageIntervals[operationId];
      }

    // Manuelles Wechseln der Bilder
    function moveOperationImage(operationId, direction) {
      const slider = document.querySelector(`.operation-image-slider[data-operation-id="${operationId}"]`);
      if (!slider) return;
      
      const images = slider.querySelectorAll('.operation-details-image');
      if (images.length <= 1) return;
      
      let currentIndex = -1;
      images.forEach((img, idx) => {
        if (img.classList.contains('active')) {
          currentIndex = idx;
        }
      });
      
      if (currentIndex === -1) return;
      
      // Berechne neuen Index
      let newIndex = currentIndex + direction;
      if (newIndex < 0) {
        newIndex = images.length - 1;
      } else if (newIndex >= images.length) {
        newIndex = 0;
      }
      
      // Wechsle Bild
      images[currentIndex].classList.remove('active');
      images[newIndex].classList.add('active');
      
      // Setze automatisches Wechseln zurück
      stopOperationImageAutoSlide(operationId);
      startOperationImageAutoSlide(operationId);
    }

    // Universelle Funktion zum Laden von JSON-Dateien (funktioniert auch mit file:///)
    function loadJSONFile(url, callback) {
      const timestamp = new Date().getTime();
      const urlWithCache = `${url}?t=${timestamp}`;
      
      // Versuche zuerst fetch() (funktioniert mit http:// und https://)
      fetch(urlWithCache, { cache: 'no-store' })
        .then(response => {
          if (!response.ok) throw new Error('Datei nicht gefunden');
          return response.json();
        })
        .then(data => {
          if (data && (data.operations || data.usArmy || data.usAirForce)) {
            callback(data, null);
          } else {
            callback(null, new Error('Ungültiges JSON-Format oder leere Datei'));
          }
        })
        .catch(fetchError => {
          // Fallback: XMLHttpRequest (funktioniert manchmal besser mit file:///)
          console.log('Fetch fehlgeschlagen, versuche XMLHttpRequest:', fetchError);
          const xhr = new XMLHttpRequest();
          
          // Für file:/// Protokoll: Verwende absolute URL relativ zur aktuellen HTML-Datei
          let urlToLoad;
          if (window.location.protocol === 'file:') {
            // Erstelle absolute URL basierend auf dem aktuellen Pfad
            const basePath = window.location.href.substring(0, window.location.href.lastIndexOf('/') + 1);
            urlToLoad = basePath + url;
            console.log('Lade Datei mit file:/// Protokoll:', urlToLoad);
          } else {
            urlToLoad = urlWithCache;
          }
          
          xhr.open('GET', urlToLoad, true);
          xhr.overrideMimeType('application/json');
          
          let hasCalled = false;
          
          xhr.onreadystatechange = function() {
            if (xhr.readyState === 4 && !hasCalled) {
              hasCalled = true;
              
              // Bei file:/// Protokoll ist status oft 0, das ist OK
              if (xhr.status === 0 || xhr.status === 200) {
                if (!xhr.responseText || xhr.responseText.trim() === '') {
                  callback(null, new Error('Die Datei ist leer'));
                  return;
                }
                
                try {
                  const data = JSON.parse(xhr.responseText);
                  
                  // Validiere, dass die Daten die erwartete Struktur haben
                  if (data && (data.operations || data.usArmy || data.usAirForce)) {
                    callback(data, null);
                  } else {
                    callback(null, new Error('Ungültiges JSON-Format: Erwartete Struktur nicht gefunden'));
                  }
                } catch (parseError) {
                  console.error('JSON Parse Fehler:', parseError);
                  console.error('Response Text:', xhr.responseText.substring(0, 200));
                  callback(null, new Error(`JSON Parse Fehler: ${parseError.message}`));
                }
              } else {
                callback(null, new Error(`HTTP ${xhr.status}: ${xhr.statusText || 'Unbekannter Fehler'}`));
              }
            }
          };
          
          xhr.onerror = function() {
            if (!hasCalled) {
              hasCalled = true;
              callback(null, new Error('Netzwerkfehler beim Laden der Datei. Stellen Sie sicher, dass die Datei existiert und lesbar ist.'));
            }
          };
          
          xhr.ontimeout = function() {
            if (!hasCalled) {
              hasCalled = true;
              callback(null, new Error('Timeout beim Laden der Datei'));
            }
          };
          
          // Timeout setzen (5 Sekunden)
          xhr.timeout = 5000;
          
          try {
            xhr.send();
          } catch (sendError) {
            if (!hasCalled) {
              hasCalled = true;
              callback(null, new Error(`Fehler beim Senden der Anfrage: ${sendError.message}`));
            }
          }
        });
    }

      // Discord Button Animation
      const discordBtn = document.getElementById('discordBtn');
      const airplane = document.getElementById('airplane');
      let isAnimating = false;
      let animationTimeout = null;

      if (discordBtn && airplane) {
        // Warte bis das Bild geladen ist
        airplane.addEventListener('load', () => {
          console.log('Flugzeug-Bild geladen');
        });
        
        airplane.addEventListener('error', () => {
          console.error('Fehler beim Laden des Flugzeug-Bildes');
        });

        discordBtn.addEventListener('mouseenter', () => {
          if (!isAnimating) {
            isAnimating = true;
            
            // Entferne die Animation-Klasse und setze zurück
            airplane.classList.remove('animate');
            airplane.style.animation = 'none';
            airplane.style.transform = 'translateX(-300px) translateY(-150px) rotate(30deg) scale(0.7)';
            
            // Force reflow
            void airplane.offsetWidth;
            
            // Starte die Animation nach kurzer Verzögerung
            setTimeout(() => {
              airplane.classList.add('animate');
              airplane.style.animation = '';
            }, 50);
            
            // Animation zurücksetzen nach Abschluss
            if (animationTimeout) clearTimeout(animationTimeout);
            animationTimeout = setTimeout(() => {
              airplane.classList.remove('animate');
              airplane.style.transform = 'translateX(-300px) translateY(-150px) rotate(30deg) scale(0.7)';
              isAnimating = false;
            }, 2500);
          }
        });
      } else {
        console.error('Discord Button oder Flugzeug nicht gefunden');
      }
    }

    // Initialisierung aufrufen
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initializePage);
    } else {
